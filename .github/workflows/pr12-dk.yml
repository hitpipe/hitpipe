name: IAM — проверки текущей реализации
on:
  pull_request:
  push:
    branches: [main, 'work/**', 'codex/pr12-agent-workspace-20261017']
    paths:
      - 'services/iam/**'
      - '.github/workflows/pr12-dk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    # Keep the existing check identity for branch protection. The closed PR1–2
    # report remains historical evidence, not a checksum lock on future IAM code.
    name: pr12-iam
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HIT68_CI_EVIDENCE: ${{ runner.temp }}/iam-postgres-checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Проверить текущий IAM, PostgreSQL, гонки и сборку
        run: python3 services/iam/tools/check_postgres_session_lookup.py --evidence-dir "$HIT68_CI_EVIDENCE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iam-postgres-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.HIT68_CI_EVIDENCE }}
          if-no-files-found: error
      - name: Область проверки
        if: always()
        run: |
          echo 'Проверяются текущий модуль IAM и чтение сессии на одноразовой PostgreSQL. Закрытая лабораторная не переаттестуется. Этот запуск не заменяет независимое ревью, человеческое принятие, проверку рабочего входа или deployment.' >> "$GITHUB_STEP_SUMMARY"
