name: PR12 iam — bootstrap or submitted component checks
on:
  pull_request:
  push:
    branches: [main, 'work/**', 'codex/pr12-agent-workspace-20261017']
    paths:
      - 'services/iam/**'
      - 'tools/pr12/**'
      - 'docs/labs/pr12/**'
      - '.github/workflows/pr12-dk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    name: pr12-iam
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify bootstrap documentation and frozen copies
        run: python3 tools/pr12/workspace.py validate
      - name: Verify bootstrap wrapper boundaries (not student tests)
        run: python3 tools/pr12/test_workspace.py
      - name: Report actual implementation state
        run: python3 tools/pr12/workspace.py status iam
      - name: Verify the filled DK report package and retained evidence
        if: hashFiles('docs/labs/pr12/dk/reports/verify_package.py') != ''
        run: python3 docs/labs/pr12/dk/reports/verify_package.py
      - uses: actions/setup-go@v5
        if: hashFiles('services/iam/lab-component.json') != ''
        with:
          go-version: '1.27.2'
          cache: false
      - name: Run actual named tests when module exists
        env:
          PR12_RACE: '1'
        run: python3 tools/pr12/workspace.py check iam
      - name: Run declared diagnostic smoke in both modes
        if: hashFiles('services/iam/lab-component.json') != ''
        run: python3 tools/pr12/workspace.py smoke iam --require
      - name: Collect cross-package IAM coverage including adapter calls from CLI tests
        if: hashFiles('services/iam/lab-component.json') != ''
        working-directory: services/iam
        run: go test -count=1 -coverpkg=./... -coverprofile=../../.pr12-build/iam-all.cover ./...
      - name: Compile isolated IAM mutations and verify the same CI gate rejects them
        if: hashFiles('services/iam/tools/mutation_check.py') != ''
        run: python3 services/iam/tools/mutation_check.py --output .pr12-build/iam/mutations-ci
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('services/iam/lab-component.json') != ''
        with:
          name: pr12-iam-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .pr12-build/iam.cover
            .pr12-build/iam-all.cover
            .pr12-build/iam/mutations-ci/
          if-no-files-found: error
      - name: Scope of this job
        if: always()
        run: |
          echo 'Missing component = NOT_IMPLEMENTED / student checks NOT_RUN. Green bootstrap is not laboratory PASS, human review, merge, or acceptance.' >> "$GITHUB_STEP_SUMMARY"
