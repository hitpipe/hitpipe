name: Intake — current module checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths: ['services/intake/**', '.github/workflows/pr12-nb.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    name: pr12-intake
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check current Intake module
        run: python3 services/intake/tools/check.py --output /tmp/intake-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-verification
          path: /tmp/intake-verification
      - name: Verification scope
        if: always()
        run: echo 'Synthetic module checks only; no durable receipt, HTTP ACK, external service, independent review or acceptance.' >> "$GITHUB_STEP_SUMMARY"
