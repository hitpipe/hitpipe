name: Intake — current webhook checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths: ['services/intake/**', '.github/workflows/pr12-nb.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    name: intake-webhook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test current local path and race isolation
        working-directory: services/intake
        run: go test -race -count=1 ./...
      - name: Analyze and build
        working-directory: services/intake
        run: |
          go vet ./...
          go build ./...
          go mod verify
      - name: Check reproduction tool syntax
        run: python3 -m py_compile services/intake/tools/compare_webhook.py
      - name: Verification scope
        if: always()
        run: echo 'Synthetic local webhook verification only. CI is not a benchmark comparison, deployed load test or independent review.' >> "$GITHUB_STEP_SUMMARY"
