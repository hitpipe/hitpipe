name: Intake — current Stripe webhook checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths: ['services/intake/**', '.github/workflows/pr12-nb.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    name: pr12-intake
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Obtain pinned sandbox image
        run: docker pull docker.io/library/postgres@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
      - name: Verify Intake HTTPS webhook and receipt
        run: python3 services/intake/tools/check_receipt.py --output /tmp/intake-receipt-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-receipt-verification
          path: /tmp/intake-receipt-verification
      - name: Verification scope
        if: always()
        run: echo 'Loopback HTTPS webhook with synthetic Stripe installation, isolated PostgreSQL and files. Live Stripe, network sender and production runtime are outside this check.' >> "$GITHUB_STEP_SUMMARY"
