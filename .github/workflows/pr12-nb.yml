name: Intake — current source facts checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths: ['services/intake/**', '.github/workflows/pr12-nb.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    name: intake-source-facts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Obtain exact isolated sandbox image
        run: docker pull docker.io/library/postgres@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
      - name: Verify private HTTPS and source facts composition
        run: python3 services/intake/tools/check_sourcefacts.py --output /tmp/intake-source-facts-verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-source-facts-verification
          path: /tmp/intake-source-facts-verification
      - name: Verification scope
        if: always()
        run: echo 'Controlled Stripe HTTPS, explicit fixture authority and owned PostgreSQL/content only. No real credentials, IAM/runtime, webhook, deployment or financial authorization.' >> "$GITHUB_STEP_SUMMARY"
