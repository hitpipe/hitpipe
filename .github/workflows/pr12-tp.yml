name: PR12 processing — bootstrap or submitted component checks
on:
  pull_request:
  push:
    branches: [main, 'work/**', 'codex/pr12-agent-workspace-20261017']
    paths:
      - 'services/processing/**'
      - 'tools/pr12/**'
      - 'docs/labs/pr12/**'
      - '.github/workflows/pr12-tp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    name: pr12-processing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify bootstrap documentation and frozen copies
        run: python3 tools/pr12/workspace.py validate
      - name: Verify bootstrap wrapper boundaries (not student tests)
        run: python3 tools/pr12/test_workspace.py
      - name: Report actual implementation state
        run: python3 tools/pr12/workspace.py status processing
      - uses: actions/setup-go@v5
        if: hashFiles('services/processing/lab-component.json') != ''
        with:
          go-version: '1.27.2'
          cache: false
      - name: Run actual named tests when module exists
        run: |
          set -o pipefail
          mkdir -p .pr12-build
          python3 tools/pr12/workspace.py check processing | tee .pr12-build/processing-check.log
      - name: Run declared diagnostic smoke in both modes
        if: hashFiles('services/processing/lab-component.json') != ''
        run: python3 tools/pr12/workspace.py smoke processing --require
      - name: Race and mutation sensitivity for Processing
        if: hashFiles('services/processing/tools/mutations/run.py') != ''
        run: |
          cd services/processing
          go test -race -count=1 ./...
          cd ../..
          python3 services/processing/tools/mutations/run.py --output .pr12-build/processing-mutations --natural-defects 1 --natural-defect-task https://hitpipe.atlassian.net/browse/HIT-29
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processing-evidence-${{ github.sha }}
          path: |
            .pr12-build/processing.cover
            .pr12-build/processing-check.log
            .pr12-build/processing-mutations/
      - name: Scope of this job
        if: always()
        run: |
          echo 'Missing component = NOT_IMPLEMENTED / student checks NOT_RUN. Green bootstrap is not laboratory PASS, human review, merge, or acceptance.' >> "$GITHUB_STEP_SUMMARY"
