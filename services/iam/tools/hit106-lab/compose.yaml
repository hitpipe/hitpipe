name: hit106-browser-lab

services:
  idp-db:
    image: docker.io/library/postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    command: &quiet-postgres
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    environment:
      POSTGRES_DB: hit106_keycloak
      POSTGRES_USER: hit106_idp
      POSTGRES_PASSWORD: ${HIT106_IDP_DB_PASSWORD:?generated by run.sh}
    tmpfs:
      - /var/lib/postgresql:size=768m
    healthcheck:
      test: [CMD, pg_isready, -U, hit106_idp, -d, hit106_keycloak]
      interval: 2s
      timeout: 3s
      retries: 40
    networks: [lab]

  iam-db:
    image: docker.io/library/postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    command: *quiet-postgres
    environment:
      POSTGRES_DB: hit106_iam
      POSTGRES_USER: hit106_iam_admin
      POSTGRES_PASSWORD: ${HIT106_IAM_ADMIN_PASSWORD:?generated by run.sh}
    tmpfs:
      - /var/lib/postgresql:size=512m
    healthcheck:
      test: [CMD, pg_isready, -U, hit106_iam_admin, -d, hit106_iam]
      interval: 2s
      timeout: 3s
      retries: 40
    networks: [lab]

  smtp:
    image: ghcr.io/axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
      MP_MAX_MESSAGES: '30'
    networks: [lab]

  idp:
    build: ../../keycloak
    image: hit106-keycloak-email-code:local
    command: [start, --optimized, --import-realm]
    environment:
      KC_HOSTNAME: https://127.0.0.1:18443
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'false'
      KC_HTTPS_CERTIFICATE_FILE: /run/hit106/tls/idp.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/hit106/tls/idp.key
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://idp-db:5432/hit106_keycloak
      KC_DB_USERNAME: hit106_idp
      KC_DB_PASSWORD: ${HIT106_IDP_DB_PASSWORD:?generated by run.sh}
      KC_BOOTSTRAP_ADMIN_USERNAME: hit106-local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${HIT106_IDP_ADMIN_PASSWORD:?generated by run.sh}
      HITPIPE_EMAIL_CODE_KEY: ${HIT106_EMAIL_CODE_KEY:?generated by run.sh}
      HITPIPE_EMAIL_CODE_KEY_VERSION: '1'
      HITPIPE_EMAIL_RATE_KEY: ${HIT106_EMAIL_RATE_KEY:?generated by run.sh}
      JAVA_OPTS_APPEND: '-XX:-UseBASE64Intrinsics'
    volumes:
      - type: bind
        source: ${HIT106_LAB_DIR:?generated by run.sh}/realm-import
        target: /opt/keycloak/data/import
        read_only: true
      - type: bind
        source: ${HIT106_LAB_DIR:?generated by run.sh}/idp-tls
        target: /run/hit106/tls
        read_only: true
    mem_limit: 1536m
    stop_grace_period: 30s
    depends_on:
      idp-db:
        condition: service_healthy
      smtp:
        condition: service_started
    networks: [lab]

networks:
  lab:
    internal: true
